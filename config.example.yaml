# ---------------------------------------------------------------------------
# vLLM Voxtral realtime STT server configuration
# ---------------------------------------------------------------------------
# Copy this file to config.yaml and fill in your values.
# The real config.yaml is gitignored and must never be committed.
#
# Model: https://huggingface.co/mistralai/Voxtral-Mini-4B-Realtime-2602
# Download weights and set model_path to the local directory.

model_path: <path/to/Voxtral-Mini-4B-Realtime-2602>   # local model directory
served_model_name: Voxtral-Mini-4B-Realtime-2602
api_key: <your-api-key>                                # any secret string for auth
host: 0.0.0.0
port: "8000"
trust_remote_code: true
# Use compilation_config OR enforce_eager (not both). Recipe recommends:
# compilation_config: '{"cudagraph_mode": "PIECEWISE"}'
enforce_eager: true
tensor_parallel_size: "1"
max_model_len: "3584"
max_num_batched_tokens: "4096"
max_num_seqs: "4"
gpu_memory_utilization: "0.90"
attention_backend: FLASH_ATTN
